# Два сайта на отдельных поддоменах:
#
#   games.myosincos.info          главное меню с выбором игры   → /var/www/games/portal
#   amazin-table.myosincos.info   Amazing Table                 → /var/www/games/amazing-table
#
# Карточный стол остаётся на play.myosincos.info со своим конфигом — его не трогаем.
#
# Установка:
#   sudo cp deploy/nginx-games.conf /etc/nginx/sites-available/games.conf
#   sudo ln -s /etc/nginx/sites-available/games.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (certbot сам допишет блоки с 443 в оба сайта):
#   sudo certbot --nginx -d games.myosincos.info -d amazin-table.myosincos.info

# ---------- Главное меню ----------
server {
    listen 80;
    listen [::]:80;
    server_name games.myosincos.info;          # ← поддомен меню

    root /var/www/games/portal;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Манифест для установки на экран телефона: nginx не знает тип .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}

# ---------- Amazing Table ----------
server {
    listen 80;
    listen [::]:80;
    server_name amazin-table.myosincos.info;   # ← поддомен игры

    root /var/www/games/amazing-table;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service worker всегда проверяется заново, иначе обновления игры доходят с задержкой.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
