# Игровой сервер: главное меню на "/", игры в своих папках.
#
#   /                 главное меню (portal/)
#   /amazing-table/   Amazing Table (статические файлы)
#   /cards/           Карточный стол (вариант А или Б ниже)
#
# Установка:
#   sudo cp deploy/nginx-games.conf /etc/nginx/sites-available/games.conf
#   sudo ln -s /etc/nginx/sites-available/games.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d amazin-table.myosincos.info  (certbot сам допишет блоки с 443)

server {
    listen 80;
    listen [::]:80;
    server_name amazin-table.myosincos.info;   # ← домен сайта с играми

    root /var/www/games/portal;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Главное меню и его иконки
    location / {
        try_files $uri $uri/ =404;
    }

    # Адреса без слэша на конце ведут в игру, а не в 404.
    location = /amazing-table { return 301 /amazing-table/; }
    location = /cards { return 301 /cards/; }

    # Манифесты для установки на экран телефона: nginx не знает тип .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
    location = /amazing-table/manifest.webmanifest {
        alias /var/www/games/amazing-table/manifest.webmanifest;
        default_type application/manifest+json;
    }

    # Amazing Table. "^~" — чтобы никакие другие правила не перехватывали её файлы.
    location ^~ /amazing-table/ {
        alias /var/www/games/amazing-table/;
        index index.html;
    }
    # Service worker всегда проверяется заново, иначе обновления игры доходят с задержкой.
    location = /amazing-table/sw.js {
        alias /var/www/games/amazing-table/sw.js;
        add_header Cache-Control "no-cache";
    }

    # Карточный стол — ВАРИАНТ А: игра — это папка с index.html, css, js.
    # Скопируйте её файлы в /var/www/games/cards/.
    location ^~ /cards/ {
        alias /var/www/games/cards/;
        index index.html;
    }

    # Карточный стол — ВАРИАНТ Б: игра работает как приложение (Node, Python) на порту.
    # Закомментируйте вариант А, раскомментируйте этот блок и поставьте свой порт.
    # location ^~ /cards/ {
    #     proxy_pass http://127.0.0.1:3000/;   # слэш в конце убирает /cards/ из пути
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;       # для WebSocket, если он есть
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
